# Atualização do Painel B3: preços (Yahoo) + fundamentos (Fundamentus) + score + app.
# Roda sozinha de segunda a sexta às 18h47 de Brasília (depois do fechamento do pregão) e também pode ser rodada à mão.
# Dados de pesquisa manual (bancos, Vale, WEG, crédito dos FIIs, macro) continuam pela skill atualizar-painel-b3 no Claude.
name: Atualizar painel

on:
  schedule:
    - cron: "47 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nova versão com preços e fundamentos
        run: |
          python 03_painel/atualizar.py nova-versao
          python 03_painel/atualizar.py precos
          python 03_painel/atualizar.py auto-datas
          python 03_painel/atualizar.py historico
          python 03_painel/atualizar.py fundamentus
          python 03_painel/atualizar.py extras
          python 03_painel/atualizar.py build
          python 03_painel/atualizar.py teste
          python 03_painel/atualizar.py site
      # a cópia completa da versão em historico/ só nas execuções manuais: a diária guardaria ~0,5 MB por pregão
      - name: Snapshot da versão
        if: github.event_name != 'schedule'
        run: python 03_painel/atualizar.py snapshot
      - name: Gravar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nada mudou (feriado?)"; exit 0; }
          git commit -m "Atualização automática $(jq -r .versao 03_painel/config.json) ($(date -u +%F))"
          # as cotações do dia (cotacoes.yml) podem ter gravado no meio: traz e tenta de novo
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
