# Testes automáticos: cálculos do módulo de investimentos (node --test) e consistência do pipeline (Python).
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes de cálculo (JavaScript)
        run: node --test 03_painel/painel/app/tests/invest.test.js
      - name: Testes do pipeline (Python)
        run: python 03_painel/atualizar.py teste
